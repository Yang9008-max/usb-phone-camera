<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>虚拟摄像头检测</title><style>body{font:18px system-ui;background:#10151c;color:#e7edf4;padding:24px}button,select{font:inherit;padding:10px;margin:8px}video{display:block;width:90%;max-height:70vh;background:#000}</style><h1>检测 Windows 摄像头</h1><p>点击检测并允许摄像头权限，选择 OBS Virtual Camera。这里只在本机预览。</p><button id="start">检测摄像头</button><select id="devices" aria-label="选择摄像头"></select><p id="status"></p><video autoplay playsinline muted></video><script>let stream;const devices=document.getElementById('devices'),status=document.getElementById('status');async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id}}:true,audio:false});document.querySelector('video').srcObject=stream;status.textContent='已打开：'+stream.getVideoTracks()[0].label}document.getElementById('start').onclick=async()=>{try{await open();const list=await navigator.mediaDevices.enumerateDevices();devices.replaceChildren();for(const d of list.filter(d=>d.kind==='videoinput')){const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label;devices.append(o)}const obs=[...devices.options].find(o=>o.text.includes('OBS Virtual'));if(obs){devices.value=obs.value;await open(obs.value)}else status.textContent+='；尚未枚举到 OBS Virtual Camera'}catch(e){status.textContent=e.message}};devices.onchange=()=>open(devices.value).catch(e=>status.textContent=e.message);</script></html>
