<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USB 手机摄像头</title>
<style>:root{color-scheme:dark;font:16px system-ui,"Microsoft YaHei",sans-serif}body{margin:0;background:#10151c;color:#e8edf4}header,footer{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a,input{font:inherit;padding:8px 12px;background:#263b57;border:1px solid #45617f;border-radius:8px;color:inherit;text-decoration:none}button,a{cursor:pointer}input{width:255px}#stage{position:relative;height:calc(100dvh - 160px);min-height:200px;background:#000}img{width:100%;height:100%;object-fit:contain}#offline{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#afbdce;padding:20px;text-align:center}footer{color:#b3c1d1}details{width:100%}.small{width:135px}</style>
<header><strong>USB 手机摄像头</strong><span id="status">连接中…</span><a href="/capture.jpg" download="camera.jpg">保存图片</a><button id="copy">复制图片</button><a href="/camera" target="_blank">纯画面</a></header>
<div id="stage"><img id="video" alt="手机摄像头"><div id="offline">请把手机通过 USB 接到这台电脑，开启 USB 网络共享，并打开手机摄像头 App。</div></div>
<footer><span id="notice">手机直接连接本机。复制或保存画面发给 AI，也可以共享纯画面窗口。</span><details><summary>手机连接设置</summary><p><label>手机地址 <input id="phone" placeholder="启动时自动识别手机地址"></label> <button id="connect">连接手机</button> <button id="disconnect">断开</button></p><p>若手机启用了认证：<input id="user" class="small" placeholder="用户名"> <input id="password" class="small" type="password" placeholder="密码"></p></details></footer>
<script>
const video=document.querySelector('#video'),offline=document.querySelector('#offline'),phone=document.querySelector('#phone');let connected=false,initialized=false;
async function post(route,data){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const s=await r.json();if(!r.ok)throw Error(s.error);return s}
async function status(){try{const s=await(await fetch('/api/status',{cache:'no-store'})).json();if(!initialized){phone.value=s.target||'';initialized=true}if(s.connected&&!connected)video.src='/stream?t='+Date.now();connected=s.connected;offline.style.display=connected?'none':'grid';offline.textContent=s.error||'请确认 USB 网络共享已开启，手机摄像头 App 保持在首页。';document.querySelector('#status').textContent=connected?'USB 本机直连 · '+s.fps+' 帧/秒': '等待手机连接';document.querySelector('#copy').disabled=!connected}catch{connected=false;offline.style.display='grid';offline.textContent='本地接收服务未启动，请重新双击启动 USB 摄像头。'}setTimeout(status,700)}status();
document.querySelector('#connect').onclick=async()=>{try{await post('/api/connect',{url:phone.value.trim(),username:document.querySelector('#user').value,password:document.querySelector('#password').value});document.querySelector('#notice').textContent='正在连接手机…'}catch(e){document.querySelector('#notice').textContent=e.message}};
document.querySelector('#disconnect').onclick=()=>post('/api/disconnect',{}).catch(()=>{});
document.querySelector('#copy').hidden=!navigator.clipboard?.write||typeof ClipboardItem==='undefined';
document.querySelector('#copy').onclick=async()=>{try{const r=await fetch('/frame.jpg',{cache:'no-store'});if(!r.ok)throw Error();const bitmap=await createImageBitmap(await r.blob());const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close();const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);document.querySelector('#notice').textContent='已复制，粘贴到 AI 对话即可。'}catch{document.querySelector('#notice').textContent='请使用保存图片上传给 AI。'}};
</script></html>
