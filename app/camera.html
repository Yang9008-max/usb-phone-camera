<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>手机摄像头画面</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#bbc5d4;font:20px system-ui}img{width:100%;height:100%;object-fit:contain}#offline{position:absolute;inset:0;display:grid;place-items:center;background:#000}</style><img src="/stream" alt="手机摄像头"><div id="offline">等待手机画面</div><script>let connected=false;async function check(){try{const s=await(await fetch('/api/status')).json();if(s.connected&&!connected)document.querySelector('img').src='/stream?t='+Date.now();connected=s.connected;document.getElementById('offline').style.display=s.connected?'none':'grid'}catch(e){connected=false;document.getElementById('offline').style.display='grid'}setTimeout(check,700)}check();</script></html>
